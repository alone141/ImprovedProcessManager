# berayprocessmanager configuration
#
# One [manager] section, an optional [defaults] section, then one
# [service NAME] section per service. Lines starting with # or ; are comments,
# and " #" starts a comment at the end of a line. Check a file with:
#
#   berayprocessmanager --check --config services.conf

[manager]
# The GUI reads the health report (--sub) and sends commands (--dealer); the
# CLI's --status reads the detailed report. "*" listens on every interface.
health_endpoint = tcp://*:6667
report_endpoint = tcp://*:6668
command_endpoint = tcp://*:5557
# Also serve commands through a router (beraynetworkmanager), under this
# identity; clients then reach the manager by name: --router ... --manager NAME.
# router_endpoint = tcp://127.0.0.1:5558
# identity = berayprocessmanager
publish_interval_ms = 1000
log_level = info          # error | warning | info | debug
cgroups = auto            # auto | off | required  (Linux: task_<name> cgroups)
gpu = auto                # auto | off             (NVML from the NVIDIA driver)

# Settings every service starts from; a service section can override each one.
[defaults]
restart = on-failure      # never | on-failure | always
restart_delay_ms = 1000   # first delay, doubled after each restart ...
restart_delay_max_ms = 30000
max_restarts = 5          # ... and at most this many within restart_window_s (0 = no limit)
restart_window_s = 60
stop_signal = TERM
stop_timeout_ms = 5000    # then SIGKILL
start_grace_ms = 1000     # counts as running once up this long (without heartbeats)
output = auto             # auto | journal | inherit | null | /absolute/log/file
env = LANG=C.UTF-8

[service logger_daemon]
description = Collects logs from every sensor
binary = /opt/beray/bin/logger_daemon
args = --out /var/log/beray --rotate 50M
working_dir = /opt/beray
restart = always

[service sensor_fusion]
description = Fuses IMU, GPS and odometry
binary = /opt/beray/bin/sensor_fusion
args = --config /etc/beray/fusion.yaml --rate 200
working_dir = /opt/beray
depends_on = logger_daemon
env = FUSION_MODE=realtime
memory_max = 1G           # needs the cgroup memory controller
cpu_max = 200%            # two cores; needs the cgroup cpu controller

[service vision_pipeline]
description = Camera capture and inference
binary = /opt/beray/bin/vision_pipeline
args = --model "/opt/beray/models/detector v3.onnx" --gpu 0
depends_on = sensor_fusion
# The service sends a heartbeat at least every second (see docs/protocol.md);
# three missed beats mark it unhealthy and restart it.
heartbeat_interval_ms = 1000
heartbeat_tolerance = 3
unhealthy_action = restart
stop_timeout_ms = 10000

[service path_planner]
binary = /opt/beray/bin/path_planner
depends_on = sensor_fusion
autostart = false         # started by hand: berayprocessmanager --start path_planner
